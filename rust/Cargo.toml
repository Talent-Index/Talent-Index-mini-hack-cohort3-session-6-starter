[package]
name = "mini_hack_session6"
version = "1.0.0"
edition = "2021"
description = "Cohort 3 Session 6 starter (Rust): autonomous payment agents, safety architecture, RAG, on-chain data methods, and the multi-provider model layer"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
rmcp = { version = "3.1.2", features = ["client", "transport-streamable-http-client-reqwest"] }
chrono = "0.4"
ethers = { version = "2", features = ["rustls"] }
